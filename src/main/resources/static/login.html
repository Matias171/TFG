<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ViajesApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #1D4E6B;
      --azul-claro: #2E7DA6;
      --acento: #F0A500;
      --fondo: #F7F9FC;
      --texto: #1A1A2E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--fondo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(29,78,107,0.12);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--azul);
      text-align: center;
      margin-bottom: 8px;
    }
    .logo span { color: var(--acento); }
    .subtitulo {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 36px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--texto);
      margin-bottom: 6px;
    }
    .form-control {
      border: 1.5px solid #E0E7EF;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      transition: border-color .2s;
    }
    .form-control:focus {
      border-color: var(--azul-claro);
      box-shadow: 0 0 0 3px rgba(46,125,166,0.12);
    }
    .btn-login {
      background: var(--azul);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 500;
      width: 100%;
      margin-top: 8px;
      transition: background .2s, transform .1s;
      cursor: pointer;
    }
    .btn-login:hover { background: var(--azul-claro); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .enlace {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .enlace a { color: var(--azul-claro); text-decoration: none; font-weight: 500; }
    .enlace a:hover { text-decoration: underline; }
    #mensaje {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      display: none;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="logo">Voya<span>ger</span></div>
    <div class="subtitulo">Bienvenido de nuevo</div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
      <div id="mensaje"></div>
    </form>

    <div class="enlace">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const msg = document.getElementById('mensaje');

      const credenciales = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      fetch('/api/usuarios/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(credenciales)
      })
      .then(res => {
        if (!res.ok) return res.text().then(t => { throw new Error(t); });
        return res.json();
      })
      .then(usuario => {
        // guardamos el usuario en sessionStorage para usarlo en otras pantallas
        sessionStorage.setItem('usuario', JSON.stringify(usuario));
        window.location.href = 'viajes.html';
      })
      .catch(err => {
        msg.style.display = 'block';
        msg.className = 'alert alert-danger';
        msg.textContent = err.message || 'Email o contraseña incorrectos.';
      });
    });
  </script>
</body>
</html>
