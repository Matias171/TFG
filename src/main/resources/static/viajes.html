<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Viajes — ViajesApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #1D4E6B;
      --azul-claro: #2E7DA6;
      --acento: #F0A500;
      --fondo: #F7F9FC;
      --texto: #1A1A2E;
    }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--fondo); min-height: 100vh; }

    /* NAVBAR */
    nav {
      background: var(--azul);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: white;
    }
    .nav-logo span { color: var(--acento); }
    .nav-usuario { color: rgba(255,255,255,0.8); font-size: 14px; }
    .btn-cerrar {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: white;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-cerrar:hover { background: rgba(255,255,255,0.1); }

    /* CONTENIDO */
    .contenido { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .titulo-seccion {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--azul);
    }
    .btn-nuevo-viaje {
      background: var(--azul);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-nuevo-viaje:hover { background: var(--azul-claro); }

    /* TARJETAS VIAJE */
    .grid-viajes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card-viaje {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 16px rgba(29,78,107,0.08);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card-viaje:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(29,78,107,0.15);
    }
    .card-destino {
      font-size: 11px;
      font-weight: 500;
      color: var(--azul-claro);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .card-nombre {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--azul);
      margin-bottom: 8px;
    }
    .card-fechas { font-size: 13px; color: #888; margin-bottom: 12px; }
    .badge-participantes {
      background: #EEF4F8;
      color: var(--azul);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .vacio {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .vacio p { margin-top: 12px; font-size: 15px; }

    /* MODAL NUEVO VIAJE */
    .modal-content { border-radius: 16px; border: none; }
    .modal-header { border-bottom: 1px solid #F0F0F0; padding: 20px 24px; }
    .modal-title { font-family: 'Playfair Display', serif; color: var(--azul); font-size: 20px; }
    .modal-body { padding: 24px; }
    .modal-footer { border-top: 1px solid #F0F0F0; padding: 16px 24px; }
    .form-control, .form-select {
      border: 1.5px solid #E0E7EF;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--azul-claro);
      box-shadow: 0 0 0 3px rgba(46,125,166,0.12);
    }
    .btn-guardar {
      background: var(--azul);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-guardar:hover { background: var(--azul-claro); }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">Voya<span>ger</span></div>
    <div class="d-flex align-items-center gap-3">
      <span class="nav-usuario" id="nombreUsuario"></span>
      <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="contenido">
    <div class="cabecera">
      <h1 class="titulo-seccion">Mis viajes</h1>
      <button class="btn-nuevo-viaje" data-bs-toggle="modal" data-bs-target="#modalViaje">
        + Nuevo viaje
      </button>
    </div>

    <div class="grid-viajes" id="listaViajes">
      <!-- Las tarjetas se generan con JS -->
    </div>
  </div>

  <!-- Modal nuevo viaje -->
  <div class="modal fade" id="modalViaje" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear nuevo viaje</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formViaje">
            <div class="mb-3">
              <label class="form-label fw-500" style="font-size:13px">Nombre del viaje</label>
              <input type="text" id="vNombre" class="form-control" placeholder="Ej: Roma 2025" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-500" style="font-size:13px">Destino</label>
              <input type="text" id="vDestino" class="form-control" placeholder="Ej: Roma">
            </div>
            <div class="mb-3">
              <label class="form-label fw-500" style="font-size:13px">Descripción</label>
              <textarea id="vDescripcion" class="form-control" rows="2" placeholder="Descripción opcional"></textarea>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label fw-500" style="font-size:13px">Fecha inicio</label>
                <input type="date" id="vFechaInicio" class="form-control">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label fw-500" style="font-size:13px">Fecha fin</label>
                <input type="date" id="vFechaFin" class="form-control">
              </div>
            </div>
            <div id="mensajeViaje" class="alert" style="display:none; border-radius:10px; font-size:14px;"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn-guardar" onclick="crearViaje()">Crear viaje</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const usuario = JSON.parse(sessionStorage.getItem('usuario'));
    if (!usuario) window.location.href = 'login.html';

    document.getElementById('nombreUsuario').textContent = 'Hola, ' + usuario.nombre;

    function cerrarSesion() {
      sessionStorage.removeItem('usuario');
      window.location.href = 'login.html';
    }

    function formatFecha(fecha) {
      if (!fecha) return '';
      return new Date(fecha).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function cargarViajes() {
      fetch(`/api/viajes/usuario/${usuario.id}`)
        .then(res => res.json())
        .then(viajes => {
          const lista = document.getElementById('listaViajes');
          if (viajes.length === 0) {
            lista.innerHTML = `
              <div class="vacio" style="grid-column:1/-1">
                <div style="font-size:48px">✈️</div>
                <p>Todavía no tienes viajes. ¡Crea el primero!</p>
              </div>`;
            return;
          }
          lista.innerHTML = viajes.map(v => `
            <a class="card-viaje" href="viaje-detalle.html?id=${v.id}">
              <div class="card-destino">${v.destino || 'Sin destino'}</div>
              <div class="card-nombre">${v.nombre}</div>
              <div class="card-fechas">
                ${v.fechaInicio ? formatFecha(v.fechaInicio) + ' → ' + formatFecha(v.fechaFin) : 'Sin fechas'}
              </div>
              <span class="badge-participantes">${(v.participantes || []).length} participantes</span>
            </a>
          `).join('');
        })
        .catch(() => {
          document.getElementById('listaViajes').innerHTML =
            '<p class="text-danger">Error al cargar los viajes.</p>';
        });
    }

    function crearViaje() {
      const msg = document.getElementById('mensajeViaje');
      const viaje = {
        nombre: document.getElementById('vNombre').value,
        destino: document.getElementById('vDestino').value,
        descripcion: document.getElementById('vDescripcion').value,
        fechaInicio: document.getElementById('vFechaInicio').value || null,
        fechaFin: document.getElementById('vFechaFin').value || null
      };

      if (!viaje.nombre) {
        msg.style.display = 'block';
        msg.className = 'alert alert-danger';
        msg.textContent = 'El nombre del viaje es obligatorio.';
        return;
      }

      fetch(`/api/viajes/${usuario.id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(viaje)
      })
      .then(res => res.json())
      .then(() => {
        bootstrap.Modal.getInstance(document.getElementById('modalViaje')).hide();
        document.getElementById('formViaje').reset();
        msg.style.display = 'none';
        cargarViajes();
      })
      .catch(() => {
        msg.style.display = 'block';
        msg.className = 'alert alert-danger';
        msg.textContent = 'Error al crear el viaje.';
      });
    }

    cargarViajes();
  </script>
</body>
</html>
