# ── Base de datos ─────────────────────────────────────────────────────────────
# En local usa localhost, en Railway usa las variables de entorno automáticamente
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/viajes_db?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:TU_PASSWORD_LOCAL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Hibernate ─────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── Puerto ────────────────────────────────────────────────────────────────────
# Railway asigna el puerto automáticamente con la variable PORT
server.port=${PORT:8080}